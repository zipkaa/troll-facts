<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Факт-Оракул Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* БАЗОВЫЕ НАСТРОЙКИ ФОНА (ГЛУБОКИЙ ЧЕРНЫЙ МОНОХРОМ) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0a0a0a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        /* КОНТЕЙНЕР ПРИЛОЖЕНИЯ С ЭФФЕКТОМ ПОЯВЛЕНИЯ */
        .app-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            animation: fadeInApp 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        /* СТИЛЬ СТЕКЛЯННОЙ КАРТОЧКИ С ФАКТОМ (ВЫТЕКАЕТ СВЕРХУ) */
        .fact-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.7),
                inset 0 1px 2px rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            transform: translateY(-30px) scale(0.95);
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fact-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .card-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .fact-text {
            font-size: 16px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.95);
            min-height: 60px;
        }

        /* ОБНОВЛЕННАЯ ЖИДКАЯ КНОПКА-КАПЛЯ (ПОД СТИЛЬ TOKYO GHOUL / DARK PREMIUM) */
        .liquid-button {
            position: relative;
            width: 170px;
            height: 170px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            /* Тонкая, почти неоновая белая граница */
            border: 1px solid rgba(255, 255, 255, 0.25);
            outline: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            
            /* Сложные многослойные тени для эффекта стеклянного объема и свечения */
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.8),
                inset 0 0 25px rgba(255, 255, 255, 0.08),
                inset 0 8px 15px rgba(255, 255, 255, 0.15),
                inset 0 -8px 20px rgba(0, 0, 0, 0.6),
                0 0 15px rgba(255, 255, 255, 0.03);
            
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            
            /* Делаем покачивание формы еще более жидким */
            animation: liquidFloat 6s ease-in-out infinite;
            transition: all 0.4s ease;
        }

        /* КРУПНЫЙ, МЯГКИЙ ВЕРХНИЙ БЛИК (БЕЗ ПЛАСТИКОВОГО ЭФФЕКТА) */
        .liquid-button::before {
            content: '';
            position: absolute;
            top: 6%;
            left: 15%;
            width: 70%;
            height: 35%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50% / 40%;
            pointer-events: none;
            filter: blur(2px); /* Размываем края, убирая дешевый глянец */
        }

        /* ДОПОЛНИТЕЛЬНЫЙ НИЖНИЙ ПОДСВЕТ ДЛЯ ПРЕЛОМЛЕНИЯ СВЕТА ВНУТРИ СТЕКЛА */
        .liquid-button::after {
            content: '';
            position: absolute;
            bottom: 8%;
            left: 30%;
            width: 40%;
            height: 15%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(4px);
        }

        /* ЭФФЕКТ ПРИ СВЕЧЕНИИ / НАВЕДЕНИИ */
        .liquid-button:hover {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.9),
                inset 0 0 30px rgba(255, 255, 255, 0.12),
                inset 0 10px 20px rgba(255, 255, 255, 0.2),
                0 0 25px rgba(255, 255, 255, 0.05);
        }

        /* ИСПРАВЛЕННЫЙ РЕЗИНОВЫЙ КЛИК */
        .liquid-button:active {
            transform: scale(0.94);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.5),
                inset 0 0 40px rgba(0, 0, 0, 0.8), /* Глубокое поглощение света внутри */
                inset 0 4px 10px rgba(255, 255, 255, 0.05);
            animation: none;
            transition: transform 0.1s cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* СТИЛЬ ДЛЯ ИКОНКИ ВНУТРИ КНОПКИ */
        .btn-icon {
            font-size: 32px;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.25));
            transition: transform 0.3s ease;
        }

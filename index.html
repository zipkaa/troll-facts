<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Факт-Оракул Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* БАЗОВЫЕ НАСТРОЙКИ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0a0a0a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }

        /* КАРТОЧКА С ФАКТОМ */
        .fact-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.5s ease;
        }

        .fact-card.active {
            opacity: 1;
            transform: translateY(0);
        }

        .card-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .fact-text {
            font-size: 16px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.95);
            min-height: 60px;
        }

        /* СТИЛЬНАЯ СТЕКЛЯННАЯ КНОПКА-КАПЛЯ */
        .liquid-button {
            position: relative;
            width: 170px;
            height: 170px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            outline: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.8),
                inset 0 0 25px rgba(255, 255, 255, 0.08),
                inset 0 8px 15px rgba(255, 255, 255, 0.15),
                inset 0 -8px 20px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            animation: liquidFloat 6s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        /* МЯГКИЙ БЛИК СВЕРХУ */
        .liquid-button::before {
            content: '';
            position: absolute;
            top: 6%;
            left: 15%;
            width: 70%;
            height: 35%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50% / 40%;
            filter: blur(1px);
            pointer-events: none;
        }

        /* ПОДСВЕТКА СНИЗУ */
        .liquid-button::after {
            content: '';
            position: absolute;
            bottom: 8%;
            left: 30%;
            width: 40%;
            height: 15%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(3px);
            pointer-events: none;
        }

        .liquid-button:active {
            transform: scale(0.95);
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.5),
                inset 0 0 30px rgba(0, 0, 0, 0.7);
        }

        .btn-icon {
            font-size: 32px;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
        }

        /* КНОПКА ПОДЕЛИТЬСЯ */
        .share-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: none; /* Изначально скрыта */
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.05);
        }

        .share-btn.visible {
            display: flex;
        }

        .share-btn:active {
            transform: scale(0.98);
            background: #e5e5e5;
        }

        .footer-info {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            margin-top: 10px;
            text-align: center;
        }

        @keyframes liquidFloat {
            0%, 100% { border-radius: 50%; transform: translateY(0); }
            33% { border-radius: 48% 52% 47% 53% / 52% 48% 52% 48%; transform: translateY(-4px); }
            66% { border-radius: 52% 48% 53% 47% / 48% 52% 47% 53%; transform: translateY(2px); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="fact-card" id="factCard">
            <div class="card-header" id="cardCategory">Случайный факт</div>
            <div class="fact-text" id="factText">Нажми на каплю ниже, чтобы запустить генератор...</div>
            <button class="share-btn" id="shareBtn">Переслать в чат</button>
        </div>

        <button class="liquid-button" id="generateBtn">
            <div class="btn-icon">🔮</div>
            <span>Тыкни</span>
        </button>

        <div class="footer-info">ГАРАНТИЯ ТОЧНОСТИ — 0%</div>
    </div>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Факт-Оракул</title>
    <link rel="stylesheet" href="style.css?v=7" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <main class="app">
        <section class="card">
            <div class="orb">🔮</div>
            <h1>Факт-Оракул</h1>
            <p class="subtitle">Абсолютно авторитетные факты без единого доказательства</p>
            <div class="fact-box">
                <p id="fact">Нажми «Сгенерировать», чтобы получить факт.</p>
            </div>
            <div class="buttons">
                <button id="generate-btn">✨ Сгенерировать</button>
                <button id="send-btn" class="secondary">📨 Отправить в чат</button>
            </div>
        </section>
    </main>
    <script src="script.js?v=7"></script>
</body>
</html>

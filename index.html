<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Факт-Оракул Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* БАЗОВЫЕ НАСТРОЙКИ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0a0a0a 100%);
            color: #ffffff; /* Основной цвет текста — белый */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }

        /* КАРТОЧКА С ФАКТОМ */
        .fact-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 1; /* Делаем видимой сразу, чтобы не исчезала */
            transform: translateY(0);
            transition: all 0.5s ease;
            text-align: center;
        }

        /* ЖЁСТКО ФИКСИРУЕМ ЦВЕТ ТЕКСТА, ЧТОБЫ ОН НЕ СТАЛ НЕВИДИМЫМ */
        .card-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #b3b3b3 !important; /* Светло-серый заголовок */
            margin-bottom: 15px;
            font-weight: 600;
            display: block;
        }

        .fact-text {
            font-size: 16px;
            line-height: 1.5;
            color: #ffffff !important; /* Всегда чисто белый текст факта */
            min-height: 60px;
            display: block;
        }

        /* ТВОЯ ОБНОВЛЕННАЯ ЖИДКАЯ КНОПКА-КАПЛЯ */
        .liquid-button {
            position: relative;
            width: 170px;
            height: 170px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            outline: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #ffffff !important; /* Текст на кнопке всегда белый */
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 25px rgba(255, 255, 255, 0.08), inset 0 8px 15px rgba(255, 255, 255, 0.15), inset 0 -8px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            animation: liquidFloat 6s ease-in-out infinite;
            transition: all 0.4s ease;
        }

        .liquid-button::before {
            content: '';
            position: absolute;
            top: 6%;
            left: 15%;
            width: 70%;
            height: 35%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50% / 40%;
            pointer-events: none;
            filter: blur(2px);
        }

        .liquid-button::after {
            content: '';
            position: absolute;
            bottom: 8%;
            left: 30%;
            width: 40%;
            height: 15%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(4px);
        }

        .liquid-button:hover {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(255, 255, 255, 0.12), inset 0 10px 20px rgba(255, 255, 255, 0.2), 0 0 25px rgba(255, 255, 255, 0.05);
        }

        .liquid-button:active {
            transform: scale(0.94);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(0, 0, 0, 0.8), inset 0 4px 10px rgba(255, 255, 255, 0.05);
            animation: none;
            transition: transform 0.1s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .btn-icon {
            font-size: 32px;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
        }

        /* КНОПКА ПОДЕЛИТЬСЯ */
        .share-btn {
            width: 100%;
            background: #ffffff;
            color: #000000 !important; /* Текст кнопки всегда черный */
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }

        .share-btn.visible {
            display: flex;
        }

        .share-btn:active {
            transform: scale(0.98);
            background: #e5e5e5;
        }

        .footer-info {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3) !important; /* Видимый серый цвет футера */
            letter-spacing: 1px;
            margin-top: 10px;
            text-align: center;
        }

        @keyframes liquidFloat {
            0%, 100% { border-radius: 50% 50% 50% 50% / 50% 50% 50% 50%; transform: translateY(0) scale(1); }
            33% { border-radius: 46% 54% 48% 52% / 53% 47% 53% 47%; transform: translateY(-5px) scale(1.01); }
            66% { border-radius: 54% 46% 52% 48% / 48% 52% 46% 54%; transform: translateY(3px) scale(0.99); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="fact-card" id="factCard">
            <span class="card-header" id="cardCategory">Случайный факт</span>
            <span class="fact-text" id="factText">Нажми на сферу ниже, чтобы запустить генератор...</span>
            <button class="share-btn" id="shareBtn">Переслать в чат</button>
        </div>

        <button class="liquid-button" id="generateBtn">
            <div class="btn-icon">🔮</div>
            <span style="color: #ffffff !important;">Тыкни</span>
        </button>

        <div class="footer-info">ГАРАНТИЯ ТОЧНОСТИ — 0%</div>
    </div>

    <script>
        // Инициализация TG WebApp
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const FACTS = [
            "Ученые доказали, что коты спят 16 часов в сутки, потому что втайне майнят криптовалюту в своей голове.",
            "Пингвины не летают только потому, что у них платный подписочный сервис на полеты, а они принципиально отказываются платить.",
            "Хамелеоны меняют цвет не для маскировки, а потому что не могут определиться, какой фильтр в инстаграме им больше подходит.",
            "Домашние хомяки на самом деле бегают в колесе, чтобы вырабатывать электричество для питания секретных серверов Википедии.",
            "Куры — это выжившие динозавры, которые притворяются глупыми, чтобы мы перестали их бояться и кормили зерном.",
            "Лягушки квакают не просто так: они работают живыми ретрансляторами и передают сигналы точного времени для подземных кротов.",
            "Жирафы на самом деле короткие, просто они постоянно ходят на невидимых ходулях, чтобы казаться выше и пафоснее остальных зверей.",
            "Собаки приносят палку не ради игры. Это древний налог, который они собирают с людей для постройки гигантского деревянного мегаполиса.",
            "Если одновременно нажать Ctrl+Alt+Delete и громко чихнуть, Windows сделает скрытый скриншот твоих мыслей.",
            "Обновления на телефоне весят так много, потому что разработчики незаметно зашивают туда рецепты бабушкиных блинов.",
            "Наушники в кармане запутываются сами по себе, потому что ночью они устраивают закрытые брейк-данс баттлы.",
            "Твой телефон вибрирует в кармане без уведомлений, потому что ему скучно и он просто хочет привлечь твое внимание.",
            "Пицца круглая, коробка квадратная, а кусочки треугольные, потому что геометрию для кулинаров придумывал безумный шляпник.",
            "Дырки в сыре маасдам проделывают специально обученные мыши-дизайнеры по контракту с итальянскими сыроварнями.",
            "Если долго смотреть на чипсы Принглс, усатый мужик с логотипа подмигнет тебе. Но только в 3 часа ночи.",
            "Наполеон Бонапарт носил руку за пазухой не из-за пафоса, он просто прятал там тамагочи, чтобы тот не умер во время битвы.",
            "Динозавры вымерли не от метеорита. Они просто решили сыграть в прятки в масштабах планеты и спрятались слишком хорошо.",
            "Луна — это не спутник Земли, а гигантский диско-шар, оставленный пришельцами после грандиозной вечеринки миллиард лет назад."
        ];

        const generateBtn = document.getElementById('generateBtn');
        const factCard = document.getElementById('factCard');
        const factText = document.getElementById('factText');
        const cardCategory = document.getElementById('cardCategory');
        const shareBtn = document.getElementById('shareBtn');

        let currentFact = "";

        generateBtn.addEventListener('click', () => {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            const randomIndex = Math.floor(Math.random() * FACTS.length);
            currentFact = FACTS[randomIndex];

            factText.innerText = currentFact;
            cardCategory.innerText = "Сгенерированная ложь";
            shareBtn.classList.add('visible');
        });

        shareBtn.addEventListener('click', () => {
            if (currentFact && tg) {
                const formattedMessage = `🧠 *Случайный факт из Mini App:*\n\n${currentFact}\n\n_❌ Гарантия точности — 0%_`;
                tg.sendData(formattedMessage);
            }
        });
    </script>
</body>
</html>

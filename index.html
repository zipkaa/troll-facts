<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Факт-Оракул Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0a0a0a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            overflow-y: auto;
        }

        .app-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding-bottom: 30px;
        }

        /* ПАНЕЛЬ СТАТИСТИКИ И ИГРОКА */
        .stats-panel {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            padding: 15px 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .user-info h3 {
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .user-rank {
            font-size: 11px;
            color: #b3b3b3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .level-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ИНДИКАТОРЫ (ЭНЕРГИЯ И ПРОГРЕСС) */
        .bars-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bar-wrapper {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 16px;
        }

        .bar-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #b3b3b3;
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.4s ease;
        }

        .energy-fill { background: linear-gradient(90deg, #ffdd59, #ff9f43); }
        .xp-fill { background: linear-gradient(90deg, #00d2d3, #01a3a4); }

        /* КАРТОЧКА С ФАКТОМ */
        .fact-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            text-align: center;
        }

        .card-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #b3b3b3 !important;
            margin-bottom: 12px;
            font-weight: 600;
            display: block;
        }

        .fact-text {
            font-size: 15px;
            line-height: 1.5;
            color: #ffffff !important;
            min-height: 50px;
            display: block;
        }

        .share-btn {
            width: 100%;
            background: #ffffff;
            color: #000000 !important;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.05);
        }

        .share-btn.visible { display: flex; }
        .share-btn:active { transform: scale(0.98); background: #e5e5e5; }

        /* КНОПКА-СФЕРА */
        .button-box {
            position: relative;
            margin: 10px 0;
        }

        .liquid-button {
            position: relative;
            width: 160px;
            height: 160px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            outline: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #ffffff !important;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 25px rgba(255, 255, 255, 0.08), inset 0 8px 15px rgba(255, 255, 255, 0.15), inset 0 -8px 20px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            animation: liquidFloat 6s ease-in-out infinite;
            transition: all 0.4s ease;
        }

        .liquid-button::before {
            content: ''; position: absolute; top: 6%; left: 15%; width: 70%; height: 35%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50% / 40%; pointer-events: none; filter: blur(2px);
        }

        .liquid-button:active:not(:disabled) {
            transform: scale(0.94);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(0, 0, 0, 0.8);
        }

        .liquid-button:disabled {
            border-color: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.2) !important;
            cursor: not-allowed;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            animation: none;
        }

        .btn-icon { font-size: 28px; transition: all 0.3s; }
        .liquid-button:disabled .btn-icon { filter: grayscale(1) opacity(0.3); }

        /* ТАБЛИЦА ЛИДЕРОВ (ТОП) */
        .leaderboard {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            padding: 15px 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .leaderboard-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #b3b3b3;
            margin-bottom: 12px;
            font-weight: 700;
            text-align: center;
        }

        .leader-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 13px;
        }

        .leader-row:last-child { border-bottom: none; }
        
        .leader-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .leader-pos {
            font-weight: 700;
            width: 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        .pos-1 { color: #ffdd59; }
        .pos-2 { color: #d2dae2; }
        .pos-3 { color: #ffa801; }
        
        .row-current-user {
            background: rgba(0, 210, 211, 0.08);
            margin: 4px -10px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px dashed rgba(0, 210, 211, 0.3);
        }

        .leader-score { font-weight: 700; color: #ffffff; }

        .footer-info {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2) !important;
            letter-spacing: 1px;
            text-align: center;
        }

        @keyframes liquidFloat {
            0%, 100% { border-radius: 50%; transform: translateY(0); }
            33% { border-radius: 46% 54% 48% 52% / 53% 47% 53% 47%; transform: translateY(-3px); }
            66% { border-radius: 54% 46% 52% 48% / 48% 52% 46% 54%; transform: translateY(2px); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="stats-panel">
            <div class="user-info">
                <h3 id="userName">Игрок</h3>
                <div class="user-rank" id="userRank">Новичок ложной науки</div>
            </div>
            <div class="level-badge" id="levelBadge">LVL 1</div>
        </div>

        <div class="bars-container">
            <div class="bar-wrapper">
                <div class="bar-label">
                    <span>⚡ Энергия</span>
                    <span id="energyText">5 / 5</span>
                </div>
                <div class="bar-bg">
                    <div class="bar-fill energy-fill" id="energyFill"></div>
                </div>
            </div>

            <div class="bar-wrapper">
                <div class="bar-label">
                    <span>✨ Опыт (XP)</span>
                    <span id="xpText">0 / 100</span>
                </div>
                <div class="bar-bg">
                    <div class="bar-fill xp-fill" id="xpFill"></div>
                </div>
            </div>
        </div>
        
        <div class="fact-card" id="factCard">
            <span class="card-header" id="cardCategory">Случайный факт</span>
            <span class="fact-text" id="factText">Нажми на сферу ниже, чтобы запустить генератор...</span>
            <button class="share-btn" id="shareBtn">Поделиться фактом</button>
        </div>

        <div class="button-box">
            <button class="liquid-button" id="generateBtn">
                <div class="btn-icon" id="btnIcon">🔮</div>
                <span id="btnText">Тыкни</span>
            </button>
        </div>

        <div class="leaderboard">
            <div class="leaderboard-title">🏆 ТОП КЛИКЕРОВ ФАКТОВ</div>
            <div id="leaderboardList">
                </div>
        </div>

        <div class="footer-info">ГАРАНТИЯ ТОЧНОСТИ — 0%</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Никнейм игрока из TG
        const currentUserName = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) 
            ? (tg.initDataUnsafe.user.first_name || "Ты") 
            : "Ты";
        
        document.getElementById('userName').innerText = currentUserName;

        const FACTS = [
            "Ученые доказали, что коты спят 16 часов в сутки, потому что втайне майнят криптовалюту в своей голове.",
            "Пингвины не летают только потому, что у них платный подписочный сервис на полеты, а они принципиально отказываются платить.",
            "Хамелеоны меняют цвет не для маскировки, а потому что не могут определиться, какой фильтр в инстаграме им больше подходит.",
            "Домашние хомяки на самом деле бегают в колесе, чтобы вырабатывать электричество для питания секретных серверов Википедии.",
            "Куры — это выжившие динозавры, которые притворяются глупыми, чтобы мы перестали их бояться и кормили зерном.",
            "Лягушки квакают не просто так: они работают живыми ретрансляторами и передают сигналы точного времени для подземных кротов.",
            "Жирафы на самом деле короткие, просто они постоянно ходят на невидимых ходулях, чтобы казаться выше и пафоснее остальных зверей.",
            "Собаки приносят палку не ради игры. Это древний налог, который они собирают с людей для постройки гигантского деревянного мегаполиса.",
            "Если одновременно нажать Ctrl+Alt+Delete и громко чихнуть, Windows сделает скрытый скриншот твоих мыслей.",
            "Обновления на телефоне весят так много, потому что разработчики незаметно зашивают туда рецепты бабушкиных блинов.",
            "Наушники в кармане запутываются сами по себе, потому что ночью они устраивают закрытые брейк-данс баттлы.",
            "Твой телефон вибрирует в кармане без уведомлений, потому что ему скучно и он просто хочет привлечь твое внимание.",
            "Пицца круглая, коробка квадратная, а кусочки треугольные, потому что геометрию для кулинаров придумывал безумный шляпник.",
            "Дырки в сыре маасдам проделывают специально обученные мыши-дизайнеры по контракту с итальянскими сыроварнями.",
            "Если долго смотреть на чипсы Принглс, усатый мужик с логотипа подмигнет тебе. Но только в 3 часа ночи.",
            "Наполеон Бонапарт носил руку за пазухой не из-за пафоса, он просто прятал там тамагочи, чтобы тот не умер во время битвы.",
            "Динозавры вымерли не от метеорита. Они просто решили сыграть в прятки в масштабах планеты и спрятались слишком хорошо.",
            "Луна — это не спутник Земли, а гигантский диско-шар, оставленный пришельцами после грандиозной вечеринки миллиард лет назад.",
            "Первые будильники состояли из людей, которые ходили по улицам и плевали в окна горожан сушеным горохом, чтобы те проснулись.",
            "Ленивцы умеют задерживать дыхание под водой дольше, чем дельфины, но забывают, зачем они вообще туда полезли.",
            "Вплоть до 19 века кетчуп продавали в аптеках Америки как сертифицированное лекарство от облысения и несварения желудка.",
            "Шотландия выбрала своим национальным животным единорога, просто чтобы позлить соседнюю Англию, у которой на гербе был скучный лев.",
            "Слезы счастья и слезы грусти под микроскопом выглядят абсолютно по-разному, потому что у них разная плотность соли.",
            "Каждый раз, когда ты открываешь банку с газировкой, один муравей в мире искренне верит, что где-то начался гром."
        ];

        // ИГРОВЫЕ ПЕРЕМЕННЫЕ (С ЗАГРУЗКОЙ ИЗ ПАМЯТИ ТЕЛЕФОНА)
        let stats = JSON.parse(localStorage.getItem('troll_stats')) || {
            clicks: 0,
            level: 1,
            xp: 0,
            energy: 5,
            lastEnergyUpdate: Date.now()
        };

        const MAX_ENERGY = 5;
        const XP_PER_LEVEL = 100;
        const ENERGY_REGEN_TIME = 60000; // 1 энергия восстанавливается за 1 минуту (60000 мс)

        const RANKS = ["Новичок ложной науки", "Любитель мифов", "Адепт Оракула", "Мастер Абсурда", "Профессор Лжи", "Магистр Вселенной"];

        function getRank(lvl) {
            let index = Math.floor((lvl - 1) / 2);
            if (index >= RANKS.length) index = RANKS.length - 1;
            return RANKS[index];
        }

        // СИСТЕМА ВОССТАНОВЛЕНИЯ ЭНЕРГИИ ОТ ВРЕМЕНИ
        function updateEnergyRegen() {
            if (stats.energy < MAX_ENERGY) {
                const now = Date.now();
                const passedTime = now - stats.lastEnergyUpdate;
                const pointsToRegen = Math.floor(passedTime / ENERGY_REGEN_TIME);

                if (pointsToRegen > 0) {
                    stats.energy = Math.min(MAX_ENERGY, stats.energy + pointsToRegen);
                    stats.lastEnergyUpdate = now - (passedTime % ENERGY_REGEN_TIME);
                    saveStats();
                }
            } else {
                stats.lastEnergyUpdate = Date.now();
            }
        }

        function saveStats() {
            localStorage.setItem('troll_stats', JSON.stringify(stats));
        }

        function renderUI() {
            updateEnergyRegen();

            // Обновляем текст и шкалы
            document.getElementById('levelBadge').innerText = `LVL ${stats.level}`;
            document.getElementById('userRank').innerText = getRank(stats.level);
            
            document.getElementById('energyText').innerText = `${stats.energy} / ${MAX_ENERGY}`;
            const energyPct = (stats.energy / MAX_ENERGY) * 100;
            document.getElementById('energyFill').style.width = `${energyPct}%`;

            document.getElementById('xpText').innerText = `${stats.xp} / ${XP_PER_LEVEL}`;
            const xpPct = (stats.xp / XP_PER_LEVEL) * 100;
            document.getElementById('xpFill').style.width = `${xpPct}%`;

            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            // Проверка КД / Лимита энергии
            if (stats.energy <= 0) {
                btn.disabled = true;
                btnIcon.innerText = "⏳";
                
                // Вычисляем сколько секунд осталось до регена 1 энергии
                const nextRegen = ENERGY_REGEN_TIME - (Date.now() - stats.lastEnergyUpdate);
                const secondsLeft = Math.max(0, Math.ceil(nextRegen / 1000));
                btnText.innerText = `Жди ${secondsLeft}с`;
            } else {
                btn.disabled = false;
                btnIcon.innerText = "🔮";
                btnText.innerText = "Тыкни";
            }

            renderLeaderboard();
        }

        // РЕНДЕР СТИЛЬНОГО ТОПА ЛИДЕРОВ
        function renderLeaderboard() {
            const mockLeaders = [
                { name: "👑 Скриптонит Логики", score: 142, pos: 1, class: "pos-1" },
                { name: "🥈 Кот Сатоши", score: 89, pos: 2, class: "pos-2" },
                { name: "🥉 Главный Крот", score: 54, pos: 3, class: "pos-3" }
            ];

            // Находим позицию текущего юзера
            let userPosition = "4+";
            if (stats.clicks > 142) userPosition = "1";
            else if (stats.clicks > 89) userPosition = "2";
            else if (stats.clicks > 54) userPosition = "3";

            let listHtml = "";
            mockLeaders.forEach(l => {
                listHtml += `
                    <div class="leader-row">
                        <div class="leader-name"><span class="leader-pos ${l.class}">${l.pos}</span> ${l.name}</div>
                        <div class="leader-score">${l.score}</div>
                    </div>
                `;
            });

            // Добавляем самого юзера в топ
            listHtml += `
                <div class="leader-row row-current-user">
                    <div class="leader-name"><span class="leader-pos" style="color:#00d2d3">${userPosition}</span> ${currentUserName} (Ты)</div>
                    <div class="leader-score">${stats.clicks}</div>
                </div>
            `;

            document.getElementById('leaderboardList').innerHTML = listHtml;
        }

        const generateBtn = document.getElementById('generateBtn');
        const factCard = document.getElementById('factCard');
        const factText = document.getElementById('factText');
        const cardCategory = document.getElementById('cardCategory');
        const shareBtn = document.getElementById('shareBtn');

        let currentFact = "";

        generateBtn.addEventListener('click', () => {
            updateEnergyRegen();
            if (stats.energy <= 0) return;

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            // Тратим энергию, получаем клик и опыт
            stats.energy -= 1;
            stats.clicks += 1;
            stats.xp += 25; // 25 XP за клик. 4 клика = новый уровень

            // Проверяем Ап Уровня
            if (stats.xp >= XP_PER_LEVEL) {
                stats.level += 1;
                stats.xp = 0;
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }

            if (stats.energy === MAX_ENERGY - 1) {
                stats.lastEnergyUpdate = Date.now();
            }

            saveStats();

            // Выбираем факт
            const randomIndex = Math.floor(Math.random() * FACTS.length);
            currentFact = FACTS[randomIndex];

            factText.innerText = currentFact;
            cardCategory.innerText = `Лживое знание #${stats.clicks}`;
            shareBtn.classList.add('visible');

            renderUI();
        });

        shareBtn.addEventListener('click', () => {
            if (currentFact && tg) {
                const textToSend = `🔮 Из Mini App: ${currentFact}`;
                tg.switchInlineQuery(textToSend, ["users", "groups", "channels"]);
            }
        });

        // Запуск таймера обновления UI раз в секунду (для обновления секунд таймера)
        setInterval(renderUI, 1000);
        renderUI();
    </script>
</body>
</html>

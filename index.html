<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Факт-Оракул</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>
  <div class="bg-orb orb-three"></div>

  <main class="app">
    <section class="hero card glass">
      <div class="badge">🔮 Mini App</div>
      <h1>Факт-Оракул</h1>
      <p class="subtitle">Генератор абсолютно уверенных, но ничем не подтверждённых фактов.</p>

      <div class="crystal-wrap" aria-hidden="true">
        <div class="crystal">🔮</div>
        <div class="ring ring-one"></div>
        <div class="ring ring-two"></div>
      </div>
    </section>

    <section class="fact-card card glass">
      <p class="label">Твой факт</p>
      <div id="fact" class="fact">Нажми кнопку — и Оракул выдаст мудрость сомнительного качества.</div>
    </section>

    <section class="controls">
      <button id="generateBtn" class="btn primary">✨ Сгенерировать</button>
      <button id="sendBtn" class="btn secondary" disabled>📨 Отправить в чат</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
